[store]
dir = "target/nextest"

[profile.default]
retries = 0
test-threads = "num-cpus"
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "pass"
final-status-level = "fail"
failure-output = "immediate"
success-output = "never"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
